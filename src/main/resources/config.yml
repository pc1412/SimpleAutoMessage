# ----------------------------------------------------
# SimpleAutoMessage 설정 파일
# SimpleAutoMessage Configuration File
#
# Minecraft Paper 26.3+ 용으로 제작되었습니다.
# Designed for Minecraft Paper 26.3+
#
# 개발: pc1412 / OSCC
# Developed by pc1412 / OSCC
# https://oscc.kr
# ----------------------------------------------------

settings:
  # 플러그인 명령어와 상태 메시지에서 사용할 언어입니다.
  # Language used for plugin commands and status messages.
  language: ko_KR

  # 자동 메시지 기능을 활성화합니다.
  # Enables the automatic message system.
  enabled: true

  # 메시지를 출력하기 위한 최소 접속자 수입니다.
  # Minimum number of online players required to send messages.
  min-players: 0

  # 출력된 자동 메시지를 서버 콘솔에도 기록합니다.
  # Logs broadcast automatic messages to the server console.
  log-to-console: false

# 메시지 목록 설정
# Message list settings
#
# 각 목록은 독립적인 타이머를 사용합니다.
# Each list uses its own independent timer.
#
# interval 값의 단위는 초입니다.
# interval is specified in seconds.
#
# expiry: -1 은 무제한 반복입니다. 양수는 실행 가능한 회차 수입니다.
# expiry: -1 repeats forever. A positive value limits the number of cycles.
#
# random: false 는 순서대로, true 는 무작위로 메시지를 선택합니다.
# random: false selects messages in order; true selects them randomly.
#
# 일반 메시지에서는 & 색상/서식 코드를 사용할 수 있습니다.
# Regular messages support & color/format codes.
#
# &#RRGGBB 형식의 RGB 색상도 사용할 수 있습니다.
# RGB colors in &#RRGGBB format are also supported.
#
# 문자열 안의 \n 은 실제 줄바꿈으로 처리됩니다.
# \n inside a message is converted to an actual line break.
#
# / 로 시작하는 메시지는 서버 콘솔 명령어로 실행됩니다.
# Messages starting with / are executed as server console commands.
message-lists:
  json:
    # JSON 컴포넌트 예제 목록입니다. 기본적으로 비활성화되어 있습니다.
    # Example JSON component list. Disabled by default.
    enabled: false
    interval: 45
    expiry: -1
    random: false
    messages:
      - |-
        {
          "text": "Hover over me!",
          "hoverEvent": {
            "action": "show_text",
            "value": [
              {
                "text": "Woah, you just hovered over me!",
                "color": "blue"
              }
            ]
          }
        }
      - |-
        {
          "text": "Click me to run a command!",
          "clickEvent": {
            "action": "run_command",
            "value": "/say Clicked."
          }
        }
      - |-
        {
          "text": "Click me to open OSCC!",
          "clickEvent": {
            "action": "open_url",
            "value": "https://oscc.kr"
          }
        }

  regular:
    # 기본 자동 메시지 목록입니다.
    # Default automatic message list.
    enabled: true
    interval: 600
    expiry: -1
    random: false
    messages:
      - '&aSimpleAutoMessage &c0.1 &afor Paper 26.3+\n&aby pc1412 / OSCC'
      - '&a& 색상코드와 &#55FF55RGB 색상을 지원합니다.\n&aSupports & color codes and &#55FF55RGB colors.'
